name: Promote QA to Production

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR from qa to main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'qa';
            const base = 'main';

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            if (existing.data.length > 0) {
              core.info(`Open PR already exists: #${existing.data[0].number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Promote qa to production',
              head,
              base,
              body: 'Automated promotion PR from qa to main (production).',
            });

            core.info(`Created PR #${pr.data.number}`);
