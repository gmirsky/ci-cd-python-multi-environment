name: CI Tests

on:
  pull_request:
    branches:
      - development
      - qa
      - main
  push:
    branches:
      - development
      - qa
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: >-
        ${{
          github.event_name == 'pull_request' &&
          (
            github.base_ref == 'main' && '3.13' ||
            github.base_ref == 'qa' && '3.12' ||
            '3.11'
          ) ||
          (
            github.ref_name == 'main' && '3.13' ||
            github.ref_name == 'qa' && '3.12' ||
            '3.11'
          )
        }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
